<!-- views/dashboard/posts_list.html -->
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body d-flex justify-content-between align-items-center">
        <h5 class="m-0">All Posts</h5>
        <a href="/posts/create" class="btn btn-primary btn-sm fw-bold">+ Write New</a>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th class="ps-4">Title</th>
                    <th>Status</th>
                    <th>Created Date</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
            </thead>
            <tbody>
                {{range .Posts}}
                <tr>
                    <td class="ps-4 fw-medium">{{.Title}} <br> <a href="/{{.Slug}}" target="_blank" rel="noopener noreferrer"><small class="text-muted fw-normal">/{{.Slug}}</small></a></td>
                    <td>
                        {{if .IsDraft}}
                            <span class="badge bg-secondary">Draft</span>
                        {{else}}
                            <span class="badge bg-success">Published</span>
                        {{end}}
                    </td>
                    <td>{{.CreatedAt.Format "02 Jan 2006"}}</td>
                    <td class="text-end pe-4">
                        <a href="/posts/edit/{{.ID}}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <a href="/posts/delete/{{.ID}}" class="btn btn-sm btn-outline-danger" data-confirm="Are you sure you want to permanently delete this post?">Delete</a>
                    </td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="4" class="text-center py-4 text-muted">No posts yet. Create the first one!</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

{{if gt .TotalPages 1}}
<nav class="mt-3">
    <ul class="pagination pagination-sm">
        <li class="page-item {{if not .HasPrev}}disabled{{end}}">
            <a class="page-link" href="/posts?page={{.PrevPage}}">&laquo;</a>
        </li>
        <li class="page-item {{if not .HasNext}}disabled{{end}}">
            <a class="page-link" href="/posts?page={{.NextPage}}">&raquo;</a>
        </li>
    </ul>
</nav>
{{end}}
