<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Go-LightBlog</title>
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="robots" content="noindex, nofollow">
    <link href="{{cacheBusterURL "/public/css/admin.min.css"}}" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar p-3 flex-shrink-0">

            </h5>
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 {{if eq .ActiveMenu "dashboard" }}active{{ end }}" href="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 {{if eq .ActiveMenu "posts" }}active{{ end }}" href="/posts">Posts</a>
                </li>
                <!-- Taxonomy Menu -->
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 {{if eq .ActiveMenu "categories" }}active{{ end }}" href="/categories">Categories</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 {{if eq .ActiveMenu "tags" }}active{{ end }}" href="/tags">Tags</a>
                </li>
                {{if eq .UserRole "admin"}}
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 {{if eq .ActiveMenu "users" }}active{{ end }}" href="/users">Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-3 py-2 {{if eq .ActiveMenu "settings" }}active{{ end }}" href="/settings">Settings</a>
                </li>
                {{end}}
                <li class="nav-item mt-4 px-3">
                    <!-- Form POST for secure logout -->
                    <form action="/logout" method="POST" class="d-inline w-100">
                        <button type="submit" class="btn btn-link text-danger p-0 m-0 text-decoration-none w-100 text-start align-baseline">
                            Logout
                        </button>
                    </form>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <div class="flex-grow-1">
            <!-- Light Header -->
            <header class="bg-white shadow-sm p-3 mb-4 d-flex justify-content-between align-items-center">
                <h4 class="m-0">{{.HeaderTitle}}</h4>
                <div class="text-muted">Hello, {{.UserName}}</div>
            </header>

            <!-- This section will be injected by the child template -->
            <main class="container-fluid px-4">
                {{embed}}
            </main>
        </div>
    </div>
    <script src="{{cacheBusterURL "/public/js/admin.min.js"}}"></script>
</body>
</html>
