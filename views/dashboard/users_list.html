<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">{{.HeaderTitle}}</h1>
    <a href="/users/create" class="btn btn-primary shadow-sm">
        + Tambah Pengguna
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="px-4 py-3">Nama (Author)</th>
                        <th class="py-3">Username</th>
                        <th class="py-3">Role</th>
                        <th class="py-3">API Key</th>
                        <th class="px-4 py-3 text-end">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Users}}
                    <tr>
                        <td class="px-4 py-3 fw-bold">{{.Name}}</td>
                        <td class="py-3">{{.Username}}</td>
                        <td class="py-3">
                            {{if eq .Role "admin"}}
                                <span class="badge bg-danger">Admin</span>
                            {{else}}
                                <span class="badge bg-info text-dark">Editor</span>
                            {{end}}
                        </td>
                        <td class="py-3">
                            <span class="text-muted small user-select-all api-key-mono">
                                {{slice .APIKey 0 12}}...
                            </span>
                            <!-- Tombol Copy menyisipkan full API Key ke dalam fungsi JS -->
                            <button class="btn btn-sm btn-light border py-0 px-2 text-secondary" 
                                    data-copy-api-key="{{.APIKey}}" 
                                    title="Salin API Key">
                                Copy
                            </button>
                        </td>
                        <td class="px-4 py-3 text-end">
                            <form action="/users/delete/{{.ID}}" method="POST" class="d-inline" data-confirm="Yakin ingin menghapus pengguna ini?">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Hapus</button>
                            </form>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</div>
