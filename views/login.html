<!-- views/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/public/assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/assets/apple-touch-icon.png">
    <title>Login - go-lightblog</title>
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="robots" content="noindex, nofollow">
    <link href="{{cacheBusterURL "/public/css/auth.min.css"}}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-sm auth-card">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Login</h4>
                
                <!-- Display error message if login fails -->
                {{if .Error}}
                <div class="alert alert-danger" role="alert">
                    {{.Error}}
                </div>
                {{end}}
                
                <form action="/login-{{.LoginToken}}/process" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <!-- Re-fill value if error occurs -->
                        <input type="text" class="form-control" id="username" name="username" value="{{.Username}}" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember" value="true">
                        <label class="form-check-label" for="remember">Remember Me (7 Days)</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
