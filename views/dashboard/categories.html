<h1 class="h3 mb-4 text-gray-800">{{.HeaderTitle}}</h1>

<div class="row">
    <!-- Left Column: Form -->
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form action="/categories" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Category Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="Example: Networking">
                        <div class="form-text small">Slug will be generated automatically.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add Category</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Right Column: Table -->
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="px-4 py-3">Name</th>
                            <th class="py-3">Slug</th>
                            <th class="px-4 py-3 text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{range .Categories}}
                        <tr>
                            <td class="px-4 py-3 fw-bold">{{.Name}}</td>
                            <td class="py-3 text-muted">{{.Slug}}</td>
                            <td class="px-4 py-3 text-end">
                                <form action="/categories/delete/{{.ID}}" method="POST" class="d-inline" data-confirm="Delete this category?">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
