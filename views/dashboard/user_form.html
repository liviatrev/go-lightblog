<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">{{.HeaderTitle}}</h1>
    <a href="/users" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<div class="row">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form action="/users/create" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Display Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Example: Editor One" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Role (Access Level)</label>
                        <select name="role" class="form-select">
                            <option value="editor">Editor (Can only write posts)</option>
                            <option value="admin">Admin (Full access)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold">Save User</button>
                </form>
            </div>
        </div>
    </div>
</div>
