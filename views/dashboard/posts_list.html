<!-- views/dashboard/posts_list.html -->
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body d-flex justify-content-between align-items-center">
        <h5 class="m-0">Semua Postingan</h5>
        <a href="/posts/create" class="btn btn-primary btn-sm fw-bold">+ Tulis Baru</a>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th class="ps-4">Judul</th>
                    <th>Status</th>
                    <th>Tanggal Dibuat</th>
                    <th class="text-end pe-4">Aksi</th>
                </tr>
            </thead>
            <tbody>
                {{range .Posts}}
                <tr>
                    <td class="ps-4 fw-medium">{{.Title}} <br> <small class="text-muted fw-normal">/{{.Slug}}</small></td>
                    <td>
                        {{if .IsDraft}}
                            <span class="badge bg-secondary">Draft</span>
                        {{else}}
                            <span class="badge bg-success">Published</span>
                        {{end}}
                    </td>
                    <td>{{.CreatedAt.Format "02 Jan 2006"}}</td>
                    <td class="text-end pe-4">
                        <a href="/posts/edit/{{.ID}}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <a href="/posts/delete/{{.ID}}" class="btn btn-sm btn-outline-danger" data-confirm="Apakah Anda yakin ingin menghapus postingan ini secara permanen?">Hapus</a>
                    </td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="4" class="text-center py-4 text-muted">Belum ada postingan. Ayo buat yang pertama!</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
