<!-- Load SunEditor CSS -->
<link href="https://cdn.jsdelivr.net/npm/suneditor@3.3.0/dist/suneditor.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/suneditor@3.3.0/dist/suneditor-contents.min.css" rel="stylesheet">
<link href="{{cacheBusterURL "/public/css/posts-form.min.css"}}" rel="stylesheet">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0 text-gray-800">{{.HeaderPostForm}}</h1>
    <a href="/posts" class="btn btn-outline-secondary btn-sm">Back</a>
</div>

<form action="/posts/create" method="POST" id="postForm">
    <div class="row">
        <!-- Main Column (Editor & SEO) -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Article Title</label>
                        <input type="text" name="title" class="form-control form-control-lg" placeholder="Enter title..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Content</label>
                        <!-- SunEditor container (visual + built-in Code/HTML view) -->
                        <div id="editor-container" class="editor-container"></div>

                        <!-- Hidden input to send to backend -->
                        <input type="hidden" name="content" id="hidden-content">
                    </div>
                </div>
            </div>

            <!-- Separate SEO Panel -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary">SEO Settings</h6>
                    <!-- Generate AI button enabled and given ID -->
                    <button type="button" id="generateSeoBtn" class="btn btn-sm btn-outline-success{{if eq .EnableGemini "no" }} d-none{{ end }}">✨ Generate AI</button>
                </div>
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Meta Title</label>
                        <!-- Added id="metaTitle" -->
                        <input type="text" id="metaTitle" name="meta_title" class="form-control" value="{{if .Post}}{{.Post.MetaTitle}}{{end}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Meta Description</label>
                        <!-- Added id="metaDesc" -->
                        <textarea id="metaDesc" name="meta_description" class="form-control" rows="2">{{if .Post}}{{.Post.MetaDescription}}{{end}}</textarea>
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-bold small">Target Keyword</label>
                        <!-- Added id="targetKeyword" -->
                        <input type="text" id="targetKeyword" name="target_keyword" class="form-control" placeholder="Example: golang web, fiber framework" value="{{if .Post}}{{.Post.TargetKeyword}}{{end}}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Column (Taxonomy & Publish) -->
        <div class="col-lg-4">
            <!-- Publication -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body py-3">
                    <div class="form-check form-switch mb-3 mt-2">
                        <input class="form-check-input" type="checkbox" name="isDraft" value="true" id="draftSwitch">
                        <label class="form-check-label fw-bold" for="draftSwitch">Save as Draft</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Publish Post</button>
                </div>
            </div>

            <!-- Cover Image (CDN Version) -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-3">
                    <label class="form-label fw-bold small">Cover Image</label>

                    <!-- File Upload Button -->
                    <input type="file" id="uploadCoverBtn" class="form-control form-control-sm mb-2" accept="image/*">

                    <!-- URL Input (Now Readonly because it's auto-filled by CDN) -->
                    <!-- Use value="{{.Post.CoverImage}}" if placed in posts_edit.html -->
                    <input type="url" id="coverImageURL" name="cover_image" class="form-control form-control-sm bg-light" placeholder="URL from CDN..." readonly>

                    <div id="uploadStatus" class="form-text small mt-1">Select an image to upload to CDN.</div>
                </div>
            </div>

            <!-- Content Type Selection -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-3">
                    <label for="type" class="form-label fw-bold">Content Type</label>
                    <select class="form-select" id="type" name="type">
                        <option value="post" selected>Regular Article (Post)</option>
                        <option value="page">Static Page</option>
                    </select>
                    <div class="form-text small text-muted">Static pages will not appear on the homepage.</div>
                </div>
            </div>

            <!-- Main Category -->
            <div class="card shadow-sm border-0 mb-4" id="div_category">
                <div class="card-body p-3">
                    <label class="form-label fw-bold small">Category</label>
                    <select name="category_id" id="select_category" class="form-select form-select-sm" required>
                        <option value="" disabled selected>Select Category...</option>
                        <option value="static">Static Page</option>
                        {{range .Categories}}
                            <option value="{{.ID}}">{{.Name}}</option>
                        {{end}}
                    </select>
                </div>
            </div>

            <!-- Tags -->
            <div class="card shadow-sm border-0 mb-4" id="div_tags">
                <div class="card-body p-3">
                    <label class="form-label fw-bold small mb-2">Related Tags</label>
                    <div class="border rounded p-2 tags-scroll">
                        {{range .Tags}}
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" name="tags[]" value="{{.ID}}" id="tag-{{.ID}}">
                            <label class="form-check-label small" for="tag-{{.ID}}">
                                {{.Name}}
                            </label>
                        </div>
                        {{end}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

<!-- Load SunEditor JS -->
<script src="https://cdn.jsdelivr.net/npm/suneditor@3.3.0/dist/suneditor.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suneditor@3.3.0/src/langs/en.js"></script>
<script src="{{cacheBusterURL "/public/js/posts-form.min.js"}}"></script>
